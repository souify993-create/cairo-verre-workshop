name: Deploy Cairo Verre to Cloudflare Workers
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Verify Cairo Verre"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cairo-verre-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies
        run: npm install
      - name: Build OpenNext for Cloudflare
        run: npx opennextjs-cloudflare build
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "030c92fded335f2ca85742c827be444c"
